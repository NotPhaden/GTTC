name: GTTC Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-gttc:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Locked to GTTC. bot.js also hardcodes GTTC as a second safeguard.
      LEAGUE_NAME: GTTC
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install discord.js@14.27.0 dotenv@17.4.2

      - name: Check GTTC rank
        run: node bot.js
